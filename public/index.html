<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NXT Xylophone - Piano Tiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Playfair+Display:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <script src="/config.js"></script>
</head>

<body data-theme="neon">

  <h1>NXT Xylophone</h1>
  <p class="subtitle">Piano Tiles Controller &amp; Note Reader Monitor</p>
  <div id="status" class="status disconnected">Disconnected</div>

  <div class="session-controls">
    <button id="session-toggle" data-state="idle" onclick="toggleSession()">
      <span class="session-dot"></span>
      <span id="session-label">Begin Session</span>
    </button>
    <span id="session-info"></span>
  </div>

  <div class="now-playing">
    <div class="label">NOW PLAYING</div>
    <div class="note" id="nowPlaying">—</div>
  </div>

  <p class="section-title">Tap a key or let the Note Reader play</p>
  
  <div class="piano">
    <button class="key" data-note="DO" onclick="sendNote('DO')"><span class="kbd">A</span>DO</button>
    <button class="key" data-note="RE" onclick="sendNote('RE')"><span class="kbd">S</span>RE</button>
    <button class="key" data-note="MI" onclick="sendNote('MI')"><span class="kbd">D</span>MI</button>
    <button class="key" data-note="FA" onclick="sendNote('FA')"><span class="kbd">F</span>FA</button>
    <button class="key" data-note="SOL" onclick="sendNote('SOL')"><span class="kbd">G</span>SOL</button>
    <button class="key" data-note="LA" onclick="sendNote('LA')"><span class="kbd">H</span>LA</button>
    <button class="key" data-note="SI" onclick="sendNote('SI')"><span class="kbd">J</span>SI</button>
    <button class="key" data-note="DO_TINGGI" onclick="sendNote('DO_TINGGI')"><span class="kbd">K</span>DO'</button>
  </div>

  <div class="log-container">
    <p class="section-title">Activity Log</p>
    <div id="log"></div>
  </div>

  <!-- INDUSTRIAL MONITOR — see docs/visualizations.md -->
  <div class="monitor">
    <p class="section-title">Industrial Monitor</p>
    <div class="monitor-grid">
      <div class="mon-card mon-flow">
        <div class="mon-card-title">Live Data Flow</div>
        <div id="flow"></div>
      </div>
      <div class="mon-card">
        <div class="mon-card-title">System Health</div>
        <div id="health"></div>
      </div>
      <div class="mon-card">
        <div class="mon-card-title">Command &rarr; Strike Latency</div>
        <div id="latency"></div>
      </div>
      <div class="mon-card mon-flow">
        <div class="mon-card-title">Motor Activity Heatmap</div>
        <div id="heatmap"></div>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <button id="settings-btn" title="Settings" aria-label="Open settings">&#9881;</button>
  
  <div id="settings-panel" class="settings-panel" role="dialog" aria-label="Settings">
    <div class="settings-header">
      <span>Settings</span>
      <button id="settings-close" aria-label="Close settings">&#x2715;</button>
    </div>

    <div class="settings-section">
      <span class="settings-label">Theme</span>
      <div class="theme-options">
        <label class="theme-option">
          <input type="radio" name="theme" value="neon" checked>
          <span class="theme-swatch theme-swatch-neon"></span>
          <span>Neon</span>
        </label>
        <label class="theme-option">
          <input type="radio" name="theme" value="classic">
          <span class="theme-swatch theme-swatch-classic"></span>
          <span>Classic Piano</span>
        </label>
        <label class="theme-option">
          <input type="radio" name="theme" value="midnight">
          <span class="theme-swatch theme-swatch-midnight"></span>
          <span>Midnight</span>
        </label>
      </div>
    </div>

    <div class="settings-section">
      <label class="settings-label" for="broker-input">MQTT Broker</label>
      <div class="broker-row">
        <input type="text" id="broker-input" placeholder="localhost">
        <button id="broker-apply">Apply</button>
      </div>
      <p class="settings-hint">WebSocket port 8883. Reconnects on Apply.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
